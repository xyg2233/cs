<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APi · TVBox 接口站</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  min-height: 100vh;
  color: #fff;
  padding: 20px;
}
.container { max-width: 800px; margin: 0 auto; }

/* 头部 */
.header {
  text-align: center;
  padding: 40px 20px 30px;
}
.header h1 {
  font-size: 2em;
  background: linear-gradient(90deg, #00d2ff, #928dff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
.header p { color: #aaa; font-size: 0.95em; }

/* 接口卡片 */
.api-card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  padding: 20px;
  margin: 20px 0;
}
.api-card label { font-size: 0.85em; color: #bbb; display: block; margin-bottom: 8px; }
.api-row {
  display: flex; gap: 8px; align-items: center;
}
.api-row input {
  flex: 1; padding: 10px 14px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.3); color: #00d2ff;
  font-size: 0.9em; outline: none;
}
.api-row button {
  padding: 10px 18px; border-radius: 8px;
  border: none; cursor: pointer;
  background: linear-gradient(90deg, #00d2ff, #928dff);
  color: #fff; font-weight: 600; font-size: 0.85em;
  transition: transform 0.15s;
}
.api-row button:active { transform: scale(0.95); }

/* 文件列表 */
.files-title {
  font-size: 1.1em; margin: 25px 0 12px; color: #ddd;
}
.file-grid { display: grid; gap: 10px; }
.file-item {
  display: flex; align-items: center; gap: 12px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 14px 16px;
  text-decoration: none; color: #eee;
  transition: all 0.2s;
}
.file-item:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(0,210,255,0.4);
  transform: translateY(-1px);
}
.file-icon {
  width: 38px; height: 38px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2em; flex-shrink: 0;
}
.icon-json { background: #f7df1e22; }
.icon-js { background: #f7df1e22; }
.icon-py { background: #3776ab22; }
.icon-doc { background: #2b579a22; }
.icon-img { background: #e44d2622; }
.icon-default { background: #ffffff11; }
.file-info { flex: 1; }
.file-name { font-size: 0.95em; font-weight: 500; }
.file-desc { font-size: 0.78em; color: #888; margin-top: 2px; }
.file-arrow { color: #555; font-size: 1.2em; }

/* 底部 */
.footer {
  text-align: center; padding: 30px 0 20px;
  color: #555; font-size: 0.8em;
}

/* 提示 */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: #00d2ff; color: #000; padding: 10px 24px;
  border-radius: 20px; font-size: 0.85em; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>📺 APi · TVBox 接口站</h1>
    <p>稳定 · 高速 · Cloudflare Pages 驱动</p>
  </div>

  <!-- TVBox 接口 -->
  <div class="api-card">
    <label>📡 TVBox 接口地址（点击复制）</label>
    <div class="api-row">
      <input id="apiUrl" value="https://apione.cc.cd/cs.json" readonly>
      <button onclick="copyApi()">复制</button>
    </div>
  </div>

  <!-- 文件列表 -->
  <div class="files-title">📁 文件列表</div>
  <div class="file-grid">

    <a class="file-item" href="cs.json" target="_blank">
      <div class="file-icon icon-json">📋</div>
      <div class="file-info">
        <div class="file-name">cs.json</div>
        <div class="file-desc">TVBox 主接口配置文件</div>
      </div>
      <span class="file-arrow">›</span>
    </a>

    <a class="file-item" href="XBPQ%E8%AF%A6%E7%BB%86%E8%AF%B4%E6%98%8E.json" target="_blank">
      <div class="file-icon icon-json">📋</div>
      <div class="file-info">
        <div class="file-name">XBPQ详细说明.json</div>
        <div class="file-desc">XBPQ 接口详细说明文档</div>
      </div>
      <span class="file-arrow">›</span>
    </a>

    <a class="file-item" href="PY%E6%A8%A1%E6%9D%BF.py" target="_blank">
      <div class="file-icon icon-py">🐍</div>
      <div class="file-info">
        <div class="file-name">PY模板.py</div>
        <div class="file-desc">Python 爬虫模板参考</div>
      </div>
      <span class="file-arrow">›</span>
    </a>

    <a class="file-item" href="XBPQ%E5%86%99%E6%BA%90%E7%AC%94%E8%AE%B0.docx" target="_blank">
      <div class="file-icon icon-doc">📄</div>
      <div class="file-info">
        <div class="file-name">XBPQ写源笔记.docx</div>
        <div class="file-desc">写源经验笔记（Word 文档）</div>
      </div>
      <span class="file-arrow">›</span>
    </a>

  </div>

  <div class="footer">
    Powered by Cloudflare Pages · apione.cc.cd
  </div>
</div>

<div class="toast" id="toast">✅ 已复制到剪贴板</div>

<script>
function copyApi() {
  const input = document.getElementById('apiUrl');
  input.select();
  input.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(input.value).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  });
}
</script>
</body>
</html>
